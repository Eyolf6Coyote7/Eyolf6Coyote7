name: WorkflowiOS
options:
  bundleIdPrefix: com.workflow
  deploymentTarget:
    iOS: "17.0"
targets:
  WorkflowiOS:
    type: application
    platform: iOS
    sources:
      - WorkflowiOS
    settings:
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: WorkflowiOS/Info.plist
  WorkflowiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WorkflowiOSTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WorkflowiOS

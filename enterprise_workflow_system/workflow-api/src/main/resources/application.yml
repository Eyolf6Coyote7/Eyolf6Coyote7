server:
  port: 4002

spring:
  application:
    name: workflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/workflow_db}
    username: ${DATABASE_USER:workflow}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:schema/
  kafka:
    bootstrap-servers: localhost:9095
    consumer:
      group-id: workflow-api
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Secrets handling policy for enterprise_workflow_system

forbidden_paths:
  - .env
  - .env.*
  - "**/secrets.{yml,yaml,json}"
  - "**/credentials*"
  - "**/*.key"
  - "**/*.pem"
  - "**/id_rsa*"
  - "**/id_ed25519*"
  - workflow-api/src/main/resources/application-prod.yml
  - admin-api/.env
  - admin-api/.env.production
  - notification-worker/src/main/resources/application-prod.yml

required_secret_manager_vars:
  # workflow-api (Spring Boot Kotlin + JPA + DGS)
  - WORKFLOW_API_DATABASE_URL
  - WORKFLOW_API_DATABASE_PASSWORD
  - WORKFLOW_API_JWT_SECRET
  # admin-api (Laravel)
  - ADMIN_API_DATABASE_URL
  - ADMIN_API_APP_KEY
  - ADMIN_API_JWT_SECRET
  # notification-worker (Spring Boot Kafka)
  - KAFKA_BROKERS
  - KAFKA_SASL_USERNAME
  - KAFKA_SASL_PASSWORD
  - SMTP_PASSWORD
  # shared tooling
  - GITHUB_TOKEN
  - SENTRY_AUTH_TOKEN

gitleaks_config: .gitleaks.toml

rotation_schedule:
  WORKFLOW_API_JWT_SECRET: 90d
  ADMIN_API_APP_KEY: 180d
  ADMIN_API_JWT_SECRET: 90d
  KAFKA_SASL_PASSWORD: 180d
  SMTP_PASSWORD: 365d

on_detect:
  action: hard_stop
  notify: ["#security"]
  log_to: .harness/security-incidents/

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────
  workflow-postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-workflow_db}
    volumes:
      - workflow-postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # Redis 7.2
  # ──────────────────────────────────────────────
  workflow-redis:
    image: redis:7.2-alpine
    container_name: workflow-redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${REDIS_PORT:-6381}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - workflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # Apache Kafka 3.7.0 (KRaft mode)
  # ──────────────────────────────────────────────
  workflow-kafka:
    image: apache/kafka:3.7.0
    container_name: workflow-kafka
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${KAFKA_PORT:-9095}:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://workflow-kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9095}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@workflow-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: workflow-kafka-cluster-001
    volumes:
      - workflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # Keycloak 25
  # ──────────────────────────────────────────────
  workflow-keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: workflow-keycloak
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://workflow-postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-workflow}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-workflow_secret}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret}
    command: start-dev
    depends_on:
      workflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # Temporal Server
  # ──────────────────────────────────────────────
  workflow-temporal:
    image: temporalio/auto-setup:1.24
    container_name: workflow-temporal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-workflow_secret}
      POSTGRES_SEEDS: workflow-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      workflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default", "--address", "localhost:7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # Temporal UI
  # ──────────────────────────────────────────────
  workflow-temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: workflow-temporal-ui
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      TEMPORAL_ADDRESS: workflow-temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8233}
    depends_on:
      - workflow-temporal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ──────────────────────────────────────────────
  workflow-minio:
    image: minio/minio:latest
    container_name: workflow-minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - workflow-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # Unleash (Feature Flags)
  # ──────────────────────────────────────────────
  workflow-unleash:
    image: unleashorg/unleash-server:latest
    container_name: workflow-unleash
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${UNLEASH_PORT:-4243}:4242"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow_secret}@workflow-postgres:5432/${UNLEASH_DB:-unleash_db}
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: ${UNLEASH_ADMIN_TOKEN:-*:*.unleash-admin-token}
    depends_on:
      workflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4242/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - workflow-net

  # ──────────────────────────────────────────────
  # MailHog (Dev email)
  # ──────────────────────────────────────────────
  workflow-mailhog:
    image: mailhog/mailhog:latest
    container_name: workflow-mailhog
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${MAILHOG_SMTP_PORT:-1026}:1025"
      - "${MAILHOG_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v2/messages?limit=1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - workflow-net

volumes:
  workflow-postgres-data:
  workflow-redis-data:
  workflow-kafka-data:
  workflow-minio-data:

networks:
  workflow-net:
    name: workflow-net
    driver: bridge

# Secrets handling policy for 3d_asset_collaboration

forbidden_paths:
  - .env
  - .env.*
  - "**/secrets.{yml,yaml,json}"
  - "**/credentials*"
  - "**/*.key"
  - "**/*.pem"
  - "**/id_rsa*"
  - "**/id_ed25519*"
  - asset-api/appsettings.Production.json
  - iot-consumer/appsettings.Production.json
  - ai-service/.env

required_secret_manager_vars:
  # asset-api (ASP.NET Core)
  - ASSET_API_DATABASE_URL
  - ASSET_API_JWT_SECRET
  - ASSET_API_SIGNALR_SHARED_KEY
  - ASSET_API_S3_ACCESS_KEY
  - ASSET_API_S3_SECRET_KEY
  # iot-consumer (.NET + Kafka + TimescaleDB)
  - IOT_TIMESCALE_URL
  - KAFKA_BROKERS
  - KAFKA_SASL_USERNAME
  - KAFKA_SASL_PASSWORD
  # ai-service (Python FastAPI + ONNX)
  - AI_SERVICE_MODEL_S3_URL
  - HUGGINGFACE_TOKEN
  # shared tooling
  - GITHUB_TOKEN
  - SENTRY_AUTH_TOKEN

gitleaks_config: .gitleaks.toml

rotation_schedule:
  ASSET_API_JWT_SECRET: 90d
  ASSET_API_SIGNALR_SHARED_KEY: 90d
  ASSET_API_S3_SECRET_KEY: 180d
  KAFKA_SASL_PASSWORD: 180d
  HUGGINGFACE_TOKEN: 365d

on_detect:
  action: hard_stop
  notify: ["#security"]
  log_to: .harness/security-incidents/

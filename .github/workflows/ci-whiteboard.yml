name: CI — Whiteboard

on:
  push:
    branches: [dev, stable]
    paths:
      - 'realtime_ai_whiteboard/**'
      - '.github/workflows/ci-whiteboard.yml'
  pull_request:
    paths:
      - 'realtime_ai_whiteboard/**'
      - '.github/workflows/ci-whiteboard.yml'

jobs:
  lint-bff:
    name: Lint — BFF API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint

  lint-web:
    name: Lint — Web App (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint

  lint-ai:
    name: Lint — AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  test-web:
    name: Test + Coverage — Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm vitest run --coverage
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: whiteboard-web.json
          label: react
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  lighthouse-web:
    name: Lighthouse CI — Web App
    runs-on: ubuntu-latest
    needs: [test-web]
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: npx vite build --mode development
        env:
          VITE_MOCK: 'true'
      - uses: treosh/lighthouse-ci-action@v12
        id: lhci
        with:
          configPath: realtime_ai_whiteboard/web-app/lighthouserc.cjs
          uploadArtifacts: true
          artifactName: lighthouse-whiteboard-web
      - name: Extract Lighthouse score
        id: lh
        run: |
          JSON=$(find ${{ steps.lhci.outputs.resultsPath }} -name '*.json' -not -name 'manifest.json' | head -1)
          A11Y=$(node -e "const r=require('$JSON');console.log(Math.round(r.categories.accessibility.score*100))")
          echo "a11y=$A11Y" >> "$GITHUB_OUTPUT"
          if [ "$A11Y" -ge 90 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "$A11Y" -ge 70 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "$A11Y" -ge 50 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
        working-directory: .
      - name: Update Lighthouse badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: whiteboard-web-lighthouse.json
          label: a11y
          message: ${{ steps.lh.outputs.a11y }}
          color: ${{ steps.lh.outputs.color }}

  test-bff:
    name: Test + Coverage — BFF API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm prisma generate
      - run: pnpm jest --coverage
        id: test
      - name: Extract coverage %
        if: steps.test.outcome == 'success'
        id: cov
        run: |
          PCT=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: steps.test.outcome == 'success' && github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: whiteboard-bff.json
          label: nestjs
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-ai:
    name: Test + Coverage — AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-cov httpx
      - run: pytest --cov=src --cov-report=json:coverage.json --cov-report=term
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(python -c "import json;d=json.load(open('coverage.json'));print(round(d['totals']['percent_covered'],1))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: whiteboard-ai.json
          label: langchain
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-mobile:
    name: Test + Coverage — Mobile App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm test:cov
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: whiteboard-mobile.json
          label: react-native
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

name: CI — Whiteboard

on:
  push:
    branches: [dev, stable]
    paths:
      - 'realtime_ai_whiteboard/**'
  pull_request:
    paths:
      - 'realtime_ai_whiteboard/**'

jobs:
  lint-bff:
    name: Lint — BFF API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint

  lint-web:
    name: Lint — Web App (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint

  lint-ai:
    name: Lint — AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  test-web:
    name: Test + Coverage — Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm vitest run --coverage
      - uses: codecov/codecov-action@v5
        with:
          files: realtime_ai_whiteboard/web-app/coverage/lcov.info
          flags: whiteboard-web
          token: ${{ secrets.CODECOV_TOKEN }}

  test-bff:
    name: Test + Coverage — BFF API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm jest --coverage
      - uses: codecov/codecov-action@v5
        with:
          files: realtime_ai_whiteboard/bff-api/coverage/lcov.info
          flags: whiteboard-bff
          token: ${{ secrets.CODECOV_TOKEN }}

  test-ai:
    name: Test + Coverage — AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-cov httpx
      - run: pytest --cov=src --cov-report=xml:coverage.xml
      - uses: codecov/codecov-action@v5
        with:
          files: realtime_ai_whiteboard/ai-service/coverage.xml
          flags: whiteboard-ai
          token: ${{ secrets.CODECOV_TOKEN }}

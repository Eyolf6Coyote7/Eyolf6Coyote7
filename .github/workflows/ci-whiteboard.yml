name: CI — Whiteboard

on:
  pull_request:
    paths:
      - 'realtime_ai_whiteboard/**'

jobs:
  lint-bff:
    name: Lint — BFF API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint

  lint-web:
    name: Lint — Web App (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint

  test-bff:
    name: Test — BFF API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm test --passWithNoTests

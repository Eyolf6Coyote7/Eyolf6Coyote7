name: Release Please

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-badges:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Get latest tags
        id: tags
        run: |
          WS=$(git tag -l 'workspace/v*' --sort=-v:refname | head -1 | sed 's|workspace/v||')
          WB=$(git tag -l 'whiteboard/v*' --sort=-v:refname | head -1 | sed 's|whiteboard/v||')
          WF=$(git tag -l 'workflow/v*' --sort=-v:refname | head -1 | sed 's|workflow/v||')
          AS=$(git tag -l '3d-asset/v*' --sort=-v:refname | head -1 | sed 's|3d-asset/v||')
          echo "workspace=${WS:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "whiteboard=${WB:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "workflow=${WF:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "asset=${AS:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Update README badges
        run: |
          sed -i "s|badge/workspace-v[0-9.]*-|badge/workspace-v${{ steps.tags.outputs.workspace }}-|" README.md
          sed -i "s|badge/whiteboard-v[0-9.]*-|badge/whiteboard-v${{ steps.tags.outputs.whiteboard }}-|" README.md
          sed -i "s|badge/workflow-v[0-9.]*-|badge/workflow-v${{ steps.tags.outputs.workflow }}-|" README.md
          sed -i "s|badge/3d--asset-v[0-9.]*-|badge/3d--asset-v${{ steps.tags.outputs.asset }}-|" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore(docs): auto-update version badges [skip ci]"
          git push

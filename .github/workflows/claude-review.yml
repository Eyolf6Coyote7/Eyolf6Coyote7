name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr_diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get real HOME
        id: home
        run: echo "dir=$(eval echo ~$(whoami))" >> "$GITHUB_OUTPUT"

      - name: Build review prompt
        run: |
          cat > /tmp/review_prompt.txt <<'EOF'
          You are a senior code reviewer. Analyze the following PR diff and respond in this exact markdown format. Output ONLY the markdown, no extra text.

          ## 🤖 Claude Code Review

          ### Summary
          - 1-3 bullet points of what changed and why

          ### Architecture Impact
          ```mermaid
          graph LR
            A[Component] --> B[Component]
          ```
          (Generate a mermaid diagram showing affected components and their relationships. If changes are docs-only, show which doc sections were affected.)

          ### Review
          | File | Severity | Comment |
          |------|----------|---------|
          | `file:line` | ⚠️ / 💡 / ✅ | description |

          ### Risk Level
          🟢 Low / 🟡 Medium / 🔴 High — with one-line reasoning

          ---
          Here is the diff:
          EOF
          cat /tmp/pr_diff.txt >> /tmp/review_prompt.txt

      - name: Claude Code Review
        env:
          HOME: ${{ steps.home.outputs.dir }}
        run: |
          claude -p "$(cat /tmp/review_prompt.txt)" --output-format text > /tmp/review_comment.md 2>&1 || {
            echo "Claude CLI exit code: $?"
            cat /tmp/review_comment.md || true
            exit 1
          }

      - name: Post review comment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/review_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

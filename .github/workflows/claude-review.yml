name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }})
          echo "$DIFF" > /tmp/pr_diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Claude Code Review
        run: |
          claude -p "You are a senior code reviewer. Analyze this PR diff and provide:

          ## 🤖 Claude Code Review

          ### Summary
          - Brief overview of changes

          ### Architecture Impact
          - Generate a mermaid diagram showing affected components and their relationships
          - Wrap in \`\`\`mermaid code block

          ### Review
          | File | Severity | Comment |
          |------|----------|---------|
          (list issues found: ⚠️ warning, 💡 suggestion, ✅ good)

          ### Risk Level
          🟢 Low / 🟡 Medium / 🔴 High

          Here is the diff:
          $(cat /tmp/pr_diff.txt)" > /tmp/review_comment.md

      - name: Post review comment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/review_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

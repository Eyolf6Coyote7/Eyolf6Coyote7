name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Review
        run: |
          # Get changed files and diff
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)

          # Write prompt to file to avoid shell escaping issues
          cat > /tmp/review-prompt.md << 'PROMPT_EOF'
          You are a senior code reviewer. Analyze the PR diff below and output a GitHub comment in EXACTLY this format:

          ## Summary
          - <bullet 1: what changed>
          - <bullet 2: why>

          ## Architecture Diagram

          ```mermaid
          graph LR
            <generate a Mermaid diagram showing the components/files affected by this PR and their relationships>
            <use subgraph to group by layer: Frontend / Backend / Infra>
            <highlight changed nodes with style>
          ```

          ## Code Review

          | File | Line | Severity | Finding |
          |------|------|----------|---------|
          | <file> | <line> | 🔴 critical / ⚠️ warning / 💡 suggestion | <description> |

          If no issues found, write "No issues found ✅" in the table.

          ## Risk Level

          <🟢 Low / 🟡 Medium / 🔴 High> — <one sentence explanation>

          ---

          IMPORTANT:
          - The Mermaid diagram is REQUIRED. Always generate it.
          - Use `graph LR` direction.
          - Mark changed components with `style <node> fill:#f9f,stroke:#333`
          PROMPT_EOF

          # Append the diff
          echo "" >> /tmp/review-prompt.md
          echo "Changed files:" >> /tmp/review-prompt.md
          echo "$CHANGED_FILES" >> /tmp/review-prompt.md
          echo "" >> /tmp/review-prompt.md
          echo "Diff:" >> /tmp/review-prompt.md
          echo '```' >> /tmp/review-prompt.md
          echo "$DIFF" >> /tmp/review-prompt.md
          echo '```' >> /tmp/review-prompt.md

          # Run Claude Code
          claude -p "$(cat /tmp/review-prompt.md)" > /tmp/review-output.md

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review-output.md', 'utf8');

            // Find existing bot comment to update instead of creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('🤖 Claude Code Review')
            );

            const body = `## 🤖 Claude Code Review\n\n${review}\n\n---\n*Auto-generated by Claude Code (self-hosted runner)*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

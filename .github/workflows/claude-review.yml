name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr_diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Claude Code Review
        env:
          PATH: ${{ format('{0}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin', env.HOME) }}
        run: |
          cat <<'PROMPT' > /tmp/review_prompt.txt
          You are a senior code reviewer. Analyze the following PR diff and respond in this exact markdown format:

          ## 🤖 Claude Code Review

          ### Summary
          - 1-3 bullet points of what changed and why

          ### Architecture Impact
          ```mermaid
          graph LR
            A[Component] --> B[Component]
          ```
          (Generate a mermaid diagram showing affected components and their relationships.
           If changes are docs-only, show which doc sections were affected.)

          ### Review
          | File | Severity | Comment |
          |------|----------|---------|
          | `file:line` | ⚠️ / 💡 / ✅ | description |

          ### Risk Level
          🟢 Low / 🟡 Medium / 🔴 High — with one-line reasoning
          PROMPT

          claude -p "$(cat /tmp/review_prompt.txt)

          Here is the diff:

          $(cat /tmp/pr_diff.txt)" --output-format text > /tmp/review_comment.md

      - name: Post review comment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/review_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Update Version Badges

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Read versions
        id: versions
        run: |
          echo "workspace=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "whiteboard=$(cat realtime_ai_whiteboard/version.txt)" >> "$GITHUB_OUTPUT"
          echo "workflow=$(cat enterprise_workflow_system/version.txt)" >> "$GITHUB_OUTPUT"
          echo "asset=$(cat 3d_asset_collaboration/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Update README badges
        run: |
          sed -i "s|badge/workspace-v[0-9.]*-|badge/workspace-v${{ steps.versions.outputs.workspace }}-|" README.md
          sed -i "s|badge/whiteboard-v[0-9.]*-|badge/whiteboard-v${{ steps.versions.outputs.whiteboard }}-|" README.md
          sed -i "s|badge/workflow-v[0-9.]*-|badge/workflow-v${{ steps.versions.outputs.workflow }}-|" README.md
          sed -i "s|badge/3d--asset-v[0-9.]*-|badge/3d--asset-v${{ steps.versions.outputs.asset }}-|" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore(docs): auto-update version badges [skip ci]"
          git push

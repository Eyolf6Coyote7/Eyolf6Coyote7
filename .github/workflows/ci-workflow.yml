name: CI — Workflow

on:
  push:
    branches: [dev, stable]
    paths:
      - 'enterprise_workflow_system/**'
      - '.github/workflows/ci-workflow.yml'
  pull_request:
    paths:
      - 'enterprise_workflow_system/**'
      - '.github/workflows/ci-workflow.yml'

jobs:
  lint-kotlin:
    name: Lint — Workflow API (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/workflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew ktlintCheck

  build-kotlin:
    name: Build — Workflow API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/workflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew build -x test

  lint-notification:
    name: Lint — Notification Worker (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/notification-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew ktlintCheck

  lint-employee-portal:
    name: Lint — Employee Portal (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/employee-portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: npx prettier --check "src/**/*.{ts,tsx,vue}"

  lint-admin-dashboard:
    name: Lint — Admin Dashboard (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: npx prettier --check "src/**/*.{ts,tsx,vue}"

  test-employee-portal:
    name: Test + Coverage — Employee Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/employee-portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm vitest run --coverage
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-portal.json
          label: vue-portal
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-admin-dashboard:
    name: Test + Coverage — Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm vitest run --coverage
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-admin.json
          label: vue-admin
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  lighthouse-employee-portal:
    name: Lighthouse CI — Employee Portal
    runs-on: ubuntu-latest
    needs: [test-employee-portal]
    defaults:
      run:
        working-directory: enterprise_workflow_system/employee-portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: enterprise_workflow_system/employee-portal/lighthouserc.cjs
          staticDistDir: enterprise_workflow_system/employee-portal/dist
          uploadArtifacts: true

  lighthouse-admin-dashboard:
    name: Lighthouse CI — Admin Dashboard
    runs-on: ubuntu-latest
    needs: [test-admin-dashboard]
    defaults:
      run:
        working-directory: enterprise_workflow_system/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: enterprise_workflow_system/admin-dashboard/lighthouserc.cjs
          staticDistDir: enterprise_workflow_system/admin-dashboard/dist
          uploadArtifacts: true

  test-workflow-api:
    name: Test + Coverage — Workflow API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/workflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew test jacocoTestReport
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(grep -oP '<td>Total</td>.*?<td class="ctr2">\K\d+' build/reports/jacoco/test/html/index.html || echo "0")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-api.json
          label: spring
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-notification-worker:
    name: Test + Coverage — Notification Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/notification-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew test jacocoTestReport
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(grep -oP '<td>Total</td>.*?<td class="ctr2">\K\d+' build/reports/jacoco/test/html/index.html || echo "0")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-notification.json
          label: kafka
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-admin-api:
    name: Test + Coverage — Admin API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/admin-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text | tee coverage-output.txt
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(grep -oP 'Lines:\s+\K[\d.]+' coverage-output.txt | head -1 || echo "0")
          echo "pct=${PCT%.*}" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-php.json
          label: laravel
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-mobile-android:
    name: Test + Coverage — Mobile Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/mobile-app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew testDebugUnitTest jacocoTestReport
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(grep -oP '<td>Total</td>.*?<td class="ctr2">\K\d+' app/build/reports/jacoco/jacocoTestReport/html/index.html || echo "0")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-mobile-android.json
          label: android
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  test-mobile-ios:
    name: Test + Coverage — Mobile iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: enterprise_workflow_system/mobile-app/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild test
          -project WorkflowiOS.xcodeproj
          -scheme WorkflowiOS
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          | xcpretty || true
      - name: Extract coverage %
        id: cov
        run: |
          PCT=$(xcrun xccov view --report --json TestResults.xcresult | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          targets=[t for t in d.get('targets',[]) if 'WorkflowiOS' in t.get('name','') and 'Tests' not in t.get('name','')]
          if not targets:
              print(0)
          else:
              files=targets[0].get('files',[])
              keep=[f for f in files if '/Views/' not in f.get('path','') and 'ContentView' not in f.get('path','') and 'App.swift' not in f.get('path','')]
              if not keep:
                  print(0)
              else:
                  covered=sum(f.get('coveredLines',0) for f in keep)
                  total=sum(f.get('lineCoverage',0)*f.get('executableLines',1) for f in keep)
                  exe=sum(f.get('executableLines',0) for f in keep)
                  print(round(covered/exe*100,1) if exe else 0)
          " 2>/dev/null || echo "0")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if [ "${PCT%.*}" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 60 ]; then echo "color=green" >> "$GITHUB_OUTPUT"; elif [ "${PCT%.*}" -ge 40 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"; else echo "color=red" >> "$GITHUB_OUTPUT"; fi
      - name: Update badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ba5e6bd35946886986dbba31e9252f66
          filename: workflow-mobile-ios.json
          label: ios
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

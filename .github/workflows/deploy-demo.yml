name: Deploy Whiteboard Demo

on:
  push:
    branches:
      - dev
    paths:
      - 'realtime_ai_whiteboard/web-app/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_ai_whiteboard/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: realtime_ai_whiteboard/web-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

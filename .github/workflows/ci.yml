name: CI

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # TODO: Add linting per project when code is added
      - name: Check commit messages
        run: |
          echo "Checking conventional commit format..."
          # Validate last commit message follows convention
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE '^(✨feat|🐛fix|♻️refactor|📘docs|🧪test|📦chore|🎨style|🎉init|🚀release)'; then
            echo "✅ Commit message follows convention"
          else
            echo "⚠️ Commit message may not follow convention: $COMMIT_MSG"
            echo "Expected format: <emoji><type>#<issue>: <description>"
          fi


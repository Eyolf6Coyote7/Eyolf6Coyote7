# Secrets handling policy for realtime_ai_whiteboard
# Read by preToolUse_secretScan.sh and by the CI `harness-verify` workflow.

# Files that AI must never read (also enforced by settings.json deny list).
forbidden_paths:
  - .env
  - .env.*
  - "**/secrets.{yml,yaml,json}"
  - "**/credentials*"
  - "**/*.key"
  - "**/*.pem"
  - "**/id_rsa*"
  - "**/id_ed25519*"
  - bff-api/.env
  - ai-service/.env

# Environment variables that must live in a secret manager and never be hard-coded.
required_secret_manager_vars:
  - BFF_DATABASE_URL
  - BFF_REDIS_URL
  - BFF_JWT_SECRET
  - BFF_YJS_JWT_SECRET
  - OPENAI_API_KEY
  - ANTHROPIC_API_KEY
  - GITHUB_TOKEN
  - SENTRY_AUTH_TOKEN

# Gitleaks config path (relative to repo root).
gitleaks_config: .gitleaks.toml

# Rotation cadence (for SRE reference — AI does not auto-rotate).
rotation_schedule:
  BFF_JWT_SECRET: 90d
  BFF_YJS_JWT_SECRET: 90d
  OPENAI_API_KEY: 180d
  ANTHROPIC_API_KEY: 180d

# Reaction when a secret is detected in AI-generated output.
on_detect:
  action: hard_stop
  notify: ["#security"]
  log_to: .harness/security-incidents/
